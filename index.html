<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf4e7">
  <meta name="apple-mobile-web-app-title" content="놀이책">
  <meta name="description" content="자동차를 타고 마을을 둘러보고, 그림으로 영어 단어를 배우고, 놀이터에서 친구와 함께 놀아요.">
  <title>어떤 놀이를 할까요?</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./play.css">
</head>
<body class="launcher-page">
  <main class="launcher">
    <header class="launcher-heading">
      <h1>어떤 놀이를 할까요<span>?</span></h1>
      <p>마음에 드는 그림을 눌러요.</p>
    </header>

    <div class="game-choices">
      <a class="game-choice town-choice" href="./town.html" aria-labelledby="town-title town-play" aria-describedby="town-description">
        <img class="choice-picture" src="./images/play-town.webp" alt="" width="1536" height="1024">
        <div class="choice-info">
          <div>
            <h2 id="town-title">꼬마 자동차 마을</h2>
            <p id="town-description">자동차를 타고 마을을 둘러봐요.</p>
          </div>
          <span class="play-action" id="town-play">놀이 시작 <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <a class="game-choice words-choice" href="./words.html" aria-labelledby="words-title words-play" aria-describedby="words-description">
        <img class="choice-picture" src="./images/play-words.webp" alt="" width="1536" height="1024">
        <div class="choice-info">
          <div>
            <h2 id="words-title">영어 단어 놀이</h2>
            <p id="words-description">그림을 누르고 영어 발음을 들어요.</p>
          </div>
          <span class="play-action" id="words-play">놀이 시작 <span aria-hidden="true">→</span></span>
        </div>
      </a>
      <a class="game-choice park-choice" href="./doll-park/" aria-labelledby="park-title park-play" aria-describedby="park-description">
        <img class="choice-picture" src="./images/play-park.webp" alt="" width="1080" height="620">
        <div class="choice-info">
          <div>
            <h2 id="park-title">모여라 놀이터</h2>
            <p id="park-description">친구를 골라 그네와 미끄럼틀을 타요.</p>
          </div>
          <span class="play-action" id="park-play">놀이 시작 <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
